info:
  name: Detect (Fast)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/detect"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "text": "TFN 123 456 782, ABN 51 824 753 556, BSB 062-000",
        "language": "en",
        "mode": "fast"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
