info:
  name: Pseudonymise (Fast)
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/pseudonymise"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "text": "Please contact Alice Smith at alice@example.com and use BSB 062-000.",
        "mode": "fast"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
