[project]
name = "priveil"
version = "0.5.0"
description = "Pseudonymisation service for reducing PII exposure in text workflows"
authors = [
    {name = "Mitchell Lisle", email = "m.lisle90@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "presidio-anonymizer>=2.2.362",
    "pydantic-ai>=2.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
gliner = [
    "gliner2[local]>=0.1",
]
mcp = [
    "mcp>=1.28.0",
]

[project.scripts]
priveil = "priveil.__main__:main"
priveil-mcp = "priveil.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priveil"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mypy>=2.1.0,<3.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0,<8",
    "httpx>=0.28.1",
    "pytest-benchmark>=5.1.0",
    "hypothesis>=6.135.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "dist", "build", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# mypy runs at 3.12 so numpy 2.x bundled stubs (which use the `type` statement)
# parse cleanly. 3.11 syntax compatibility is enforced by ruff's target-version
# and verified at runtime by the CI Docker matrix (3.11 / 3.12 / 3.13).
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
